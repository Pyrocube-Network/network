[versions]
# Libs
minestom = "2026.10.07-26.2"
velocity = "4.2.1-SNAPSHOT"
zstd = "1.5.7-22"

# Plugins
shadow = "9.6.1"
spotless = "8.10.4"

# Other
logback = "1.6.5"
slf4j = "2.0.20"
junit = "6.1.3"

[libraries]
minestom = { group = "net.minestom", name = "minestom", version.ref = "minestom" }
zstdJni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstd" }
velocityApi = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }
slf4j = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
junitBom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junitJupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junitLauncher = { group = "org.junit.platform", name = "junit-platform-launcher" }


[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
